name: Deploy Git Pulse Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Prepare Lambda Package
        run: |
          mkdir -p package
          pip install -r requirements.txt -t package || true
          cp src/main.py package/
          cd package && zip -r ../lambda_package.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Generate Function and Role Names
        id: names
        run: |
          IDENTIFIER=${GITHUB_RUN_ID:-$(date +%s)}
          echo "LAMBDA_FUNCTION_NAME=git-pulse-lambda-$IDENTIFIER" >> $GITHUB_ENV
          echo "LAMBDA_ROLE_NAME=git-pulse-role-$IDENTIFIER" >> $GITHUB_ENV
          echo "Generated names → Function: git-pulse-lambda-$IDENTIFIER, Role: git-pulse-role-$IDENTIFIER"

      - name: Create IAM Role for Lambda
        run: |
          TRUST_POLICY=$(cat <<EOF
{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Effect": "Allow",
      "Principal": {
        "Service": "lambda.amazonaws.com"
      },
      "Action": "sts:AssumeRole"
    }
  ]
}
EOF
)
          aws iam create-role \
            --role-name "$LAMBDA_ROLE_NAME" \
            --assume-role-policy-document "$TRUST_POLICY"

          aws iam attach-role-policy \
            --role-name "$LAMBDA_ROLE_NAME" \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

          # Wait for IAM to propagate
          sleep 10

          ROLE_ARN=$(aws iam get-role --role-name "$LAMBDA_ROLE_NAME" --query "Role.Arn" --output text)
          echo "LAMBDA_ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV

      - name: Deploy Lambda
        run: |
          aws lambda create-function \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --runtime python3.11 \
            --role "$LAMBDA_ROLE_ARN" \
            --handler main.handle \
            --timeout 30 \
            --memory-size 128 \
            --zip-file fileb://lambda_package.zip

      - name: Output Deployment Info
        run: |
          echo "✅ Lambda Function: $LAMBDA_FUNCTION_NAME"
          echo "✅ IAM Role: $LAMBDA_ROLE_NAME"
